{% extends "main.html" %}

{% block content %}
<div class="wizard">
  {{ page.content|replace('href="@docs/', 'href="' ~ config.extra.docs_url) }}

  <div id="wizard"
       data-devices="{{ 'assets/devices.json'|url }}"
       data-base="{{ ''|url }}"
       data-docs="{{ config.extra.docs_url }}"
       data-logo="{{ config.extra.logo }}">
    <noscript>
      <div class="notice">
        This guide needs JavaScript. Without it, pick your download from the
        <a href="{{ config.extra.docs_url }}wonderful-kernel/samsung-a23xq/#download">device page</a>.
      </div>
    </noscript>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ 'js/install.js'|url }}" defer></script>
{% endblock %}
