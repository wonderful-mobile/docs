site_name: Wonderful Mobile
site_url: https://wonderful-mobile-docs.techtransthai.org
repo_url: https://github.com/wonderful-mobile/docs
edit_uri: 'edit/main/docs/'

site_description: Wonderful Mobile builds custom kernels and the tools and patches behind them for Android phones.
site_author: Wonderful Mobile Project

# Custom theme in theme/. Only needs mkdocs and py3-pymdown-extensions,
# the same packages the Woodpecker deploy installs.
theme:
  name: null
  custom_dir: theme
  locale: en

plugins: []

nav:
  - Home: index.md
  - Wonderful Kernel:
      - Overview: wonderful-kernel/index.md
      - Download: wonderful-kernel/download.md
      - Install: wonderful-kernel/install.md
      - Upgrade: wonderful-kernel/upgrade.md
      - Root managers: wonderful-kernel/root-managers.md
      - Tweaks: wonderful-kernel/tweaks.md
      - Devices:
          - Samsung Galaxy A23 5G: wonderful-kernel/samsung-a23xq.md
  - Tools and Patches:
      - Overview: tools/index.md
      - Building the kernel: tools/building.md
      - Porting to your kernel: tools/porting.md

extra:
  logo: https://dl.techtransthai.org/resources/icons/wonderful-mobile.svg
  github: https://github.com/wonderful-mobile
  header_links:
    - title: Wonderful Kernel
      url: wonderful-kernel/
    - title: Tools and Patches
      url: tools/
  footer: Wonderful Mobile is a TechTransThai project. Documentation licensed under CC BY-SA 4.0.

markdown_extensions:
  - tables
  - toc:
      permalink: false
  - attr_list
  - md_in_html
  - pymdownx.tilde
